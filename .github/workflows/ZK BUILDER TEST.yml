name: ZK BUILDER TEST

on:
  workflow_dispatch:
    inputs:
      URL:
        description: "XIAOMI.EU URL (Google Drive or SourceForge)"
        required: true
      SFU:
        description: "Upload to Clouds"
        type: boolean
        default: 'true'
      EXT4:
        description: "Force EXT4"
        type: boolean
        default: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ROM_URL: ${{ github.event.inputs.URL }}

    steps:
      # ============================================
      # CLONE SOURCE REPO
      # ============================================
      - name: Clone ZK AUTO BUILD sources
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.PRIVATE_REPO_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

          git clone -b main --depth=1 git@github.com:zuri1503/ZK_AUTO_BUILD.git "$GITHUB_WORKSPACE/build_src"

          echo "ZK_HOME=$GITHUB_WORKSPACE/build_src" >> $GITHUB_ENV

      # ============================================
      # DISK SPACE SETUP
      # ============================================
      - name: Check free disk space
        id: diskcheck
        run: |
          FREE_GB=$(df -BG / | awk 'NR==2 {gsub("G","",$4); print $4}')
          echo "Free disk space: ${FREE_GB}GB"
          echo "need_cleanup=$( [ "$FREE_GB" -lt 50 ] && echo true || echo false )" >> $GITHUB_OUTPUT

      - name: Maximize build disk space
        if: steps.diskcheck.outputs.need_cleanup == 'true'
        uses: AdityaGarg8/remove-unwanted-software@v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          remove-cached-tools: 'true'

      # ============================================
      # SETUP BUILD ENVIRONMENT
      # ============================================
      - name: Setup build environment
        run: |
          sudo timedatectl set-timezone UTC
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            android-sdk-libsparse-utils aria2 \
            openjdk-17-jdk-headless \
            openssh-client p7zip-full \
            python3 python-is-python3 python3-pip \
            zip zipalign > /dev/null 2>&1

          # Auto-detect workers based on CPU
          WORKERS=$(nproc)
          echo "WORKERS=$WORKERS" >> $GITHUB_ENV

          # Parse ROM name and set ZK_NAME
          DATE=$(TZ=UTC date +"%y%m%d")
          ROM_NAME="$(basename "${ROM_URL%/download}")"

          if [[ "$ROM_NAME" == *_OS* ]]; then
            if [[ "$ROM_NAME" =~ ^xiaomi\.eu_([^_]+)_(OS[0-9.]+)\.([A-Z0-9]+)_([0-9]+)\.zip$ ]]; then
              DEVICE="${BASH_REMATCH[1]^^}"
              OS_VER="${BASH_REMATCH[2]}"
              REGION="${BASH_REMATCH[3]}"
              ZK_NAME="ZKOS_${DEVICE}_${OS_VER}.${REGION}_EU${DATE}"
            else
              ZK_NAME="ZKOS_XIAOMI_EU${DATE}"
            fi
          elif [[ "$ROM_NAME" == *_V14* ]]; then
            if [[ "$ROM_NAME" =~ ^xiaomi\.eu_multi_([A-Za-z0-9]+)_?(.*)_(V14\.[0-9.]+)\.([A-Z0-9]+)_v14-([0-9]+)\.zip$ ]]; then
              DEVICE="${BASH_REMATCH[1]^^}"
              OS_VER="${BASH_REMATCH[3]}"
              REGION="${BASH_REMATCH[4]}"
              ZK_NAME="ZKUI_${DEVICE}_${OS_VER}.${REGION}_EU${DATE}"
            else
              ZK_NAME="ZKUI_XIAOMI_EU${DATE}"
            fi
          else
            ZK_NAME="ZK_XIAOMI_EU${DATE}"
          fi

          echo "ZK_NAME=$ZK_NAME" >> $GITHUB_ENV
          echo "DEVICE=${DEVICE:-N/A}" >> $GITHUB_ENV
          echo "ROM_VER=${OS_VER:-V14}" >> $GITHUB_ENV
          echo "::notice::ZK_NAME=$ZK_NAME"

      # ============================================
      # DOWNLOAD ROM
      # ============================================
      - name: Download ROM
        run: |
          DEST_DIR="$GITHUB_WORKSPACE/ROM"
          mkdir -p "$DEST_DIR"

          if [[ "$ROM_URL" == *"drive.google.com"* ]]; then
            echo "::group::Downloading from Google Drive"
            pip install --quiet gdown > /dev/null 2>&1
            gdown --fuzzy -O "$DEST_DIR/${ZK_NAME}.zip" "$ROM_URL"
            echo "::endgroup::"

          elif [[ "$ROM_URL" == *"sourceforge.net/projects/"* ]]; then
            echo "::group::Downloading from SourceForge"
            SF_PATH=$(python3 - <<'PYEOF'
from urllib.parse import urlparse, unquote
import os
p = urlparse(os.environ["ROM_URL"])
parts = [unquote(p) for p in p.path.split("/")]
proj = parts[2]
fpath = "/".join(parts[4:]).removesuffix("/download")
print(f"{proj}/{fpath}")
PYEOF
            )

            MIRRORS=(
              "https://cfhcable.dl.sourceforge.net/project"
              "https://pilotfiber.dl.sourceforge.net/project"
              "https://gigenet.dl.sourceforge.net/project"
              "https://netcologne.dl.sourceforge.net/project"
            )

            for mirror in "${MIRRORS[@]}"; do
              echo "Trying: $mirror"
              if timeout 1800 aria2c \
                  --max-tries=3 \
                  --retry-wait=5 \
                  --split=8 \
                  --max-connection-per-server=8 \
                  --console-log-level=warn \
                  -d "$DEST_DIR" -o "${ZK_NAME}.zip" \
                  "${mirror}/${SF_PATH}?viasf=1"; then
                echo "Download successful!"
                break
              fi
              rm -f "$DEST_DIR/${ZK_NAME}.zip"
            done
            echo "::endgroup::"
          fi

          # Verify download
          if [ ! -s "$DEST_DIR/${ZK_NAME}.zip" ]; then
            echo "::error::Download failed or file is empty"
            exit 1
          fi
          echo "Download complete: $(du -h "$DEST_DIR/${ZK_NAME}.zip" | cut -f1)"

          # Move ROM to source repo
          mv -f "$DEST_DIR/${ZK_NAME}.zip" "$ZK_HOME/ROM/"
          sudo chmod -R +x "$ZK_HOME"

      # ============================================
      # BUILD ROM
      # ============================================
      - name: Build ProjectZK ROM
        run: |
          echo "::group::Building ROM"
          echo "Workers: $WORKERS"
          echo "ROM: $ZK_NAME"
          echo "EXT4: ${{ github.event.inputs.EXT4 }}"
          echo "::endgroup::"

          sudo bash "$ZK_HOME/build.sh" "$GITHUB_ENV" "$ZK_NAME" "${{ github.event.inputs.EXT4 }}"

      # ============================================
      # CLEANUP CACHE (Reusable source)
      # ============================================
      - name: Cleanup build cache
        run: |
          echo "::group::Cleaning up build cache..."

          # Remove extracted ROM and working files
          rm -rf "$ZK_HOME/ROM"/*
          rm -rf "$ZK_HOME/work"/*
          rm -rf "$ZK_HOME/base"/*

          # Remove temp files created during build
          rm -rf "$ZK_HOME/temp" 2>/dev/null || true
          rm -rf "$ZK_HOME"/*.log 2>/dev/null || true
          rm -rf "$ZK_HOME/images"/*.img.new 2>/dev/null || true

          # Clean __pycache__
          find "$ZK_HOME" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find "$ZK_HOME" -type f -name "*.pyc" -delete 2>/dev/null || true

          # Clean pip cache
          rm -rf ~/.cache/pip 2>/dev/null || true

          # Clean apt cache
          sudo apt-get clean 2>/dev/null || true

          echo "::endgroup::"
          echo "Cache cleaned! Source repo is ready for next build."

      # ============================================
      # UPLOAD TO CLOUDS
      # ============================================
      - name: Upload ROM to Clouds
        if: github.event.inputs.SFU == 'true'
        run: |
          cd "$ZK_HOME/tools"

          # Setup credentials
          echo "${{ secrets.TOKEN_PICKLE3 }}" | base64 -d > token.pickle
          echo "${{ secrets.UPLOADER }}" | base64 -d > upload.py
          echo "${{ secrets.SF_SSH_KEY }}" > key
          chmod 0600 key token.pickle upload.py

          # SourceForge upload
          sf_upload() {
            local src="$1" dest_path="$2"
            rsync -a --partial -q \
              -e "ssh -i key -o StrictHostKeyChecking=no" \
              "$src" \
              "zuri1503@frs.sourceforge.net:/home/frs/project/projectzk/ProjectZK/${dest_path}/"
            echo "Uploaded to SF: $dest_path"
          }

          # Google Drive upload
          gd_upload() {
            python upload.py --folder-id "$1" "$ROM_OUTPUT" > /dev/null 2>&1
            echo "Uploaded to GDrive: $1"
          }

          # PixelDrain backup
          pd_upload() {
            curl -u ":${{ secrets.PIXELDRAIN_API }}" \
              -X PUT -T "$ROM_OUTPUT" \
              "https://pixeldrain.com/api/file/${ZK_NAME}.zip" > /dev/null 2>&1
            echo "Uploaded to PixelDrain"
          }

          # Upload based on ROM version
          case "$ROM_VER" in
            V14)
              sf_upload "$ROM_OUTPUT" "ZK-EU/ZKUI14"
              gd_upload "1a2O_DmmxH6o4szRJaBQjSfYXjYvdlRUO"
              echo "ZK_LINK=https://sourceforge.net/projects/projectzk/files/ProjectZK/ZK-EU/ZKUI14" >> $GITHUB_ENV
              ;;
            OS1|OS1_A13)
              sf_upload "$ROM_OUTPUT" "ZK-EU/ZKOS1"
              gd_upload "1Ke3q3WE5kjLmST63xaea6pos9L_IjBXq"
              echo "ZK_LINK=https://sourceforge.net/projects/projectzk/files/ProjectZK/ZK-EU/ZKOS1" >> $GITHUB_ENV
              ;;
            OS2|OS2_A14)
              sf_upload "$ROM_OUTPUT" "ZK-EU/ZKOS2"
              gd_upload "1xQJPeS5yI0Tva5AMOJoz05voJQCmzsBR"
              echo "ZK_LINK=https://sourceforge.net/projects/projectzk/files/ProjectZK/ZK-EU/ZKOS2" >> $GITHUB_ENV
              ;;
            OS3|OS3_A15)
              sf_upload "$ROM_OUTPUT" "ZK-EU/ZKOS3"
              gd_upload "1fFNVQDoS4qnOIZP1xyoAiPYGUK2lUUNu"
              echo "ZK_LINK=https://sourceforge.net/projects/projectzk/files/ProjectZK/ZK-EU/ZKOS3" >> $GITHUB_ENV
              ;;
            *)
              echo "::warning::Unknown ROM_VER=$ROM_VER, skipping cloud upload"
              pd_upload
              ;;
          esac

          # Cleanup credentials
          rm -f key token.pickle upload.py

      # ============================================
      # PIXELDRAIN BACKUP (if SFU disabled)
      # ============================================
      - name: PixelDrain Backup
        if: github.event.inputs.SFU == 'false'
        run: |
          curl -u ":${{ secrets.PIXELDRAIN_API }}" \
            -X PUT -T "$ROM_OUTPUT" \
            "https://pixeldrain.com/api/file/${ZK_NAME}.zip" > /dev/null 2>&1
          echo "::notice::ROM uploaded to PixelDrain"

      # ============================================
      # TELEGRAM NOTIFICATION
      # ============================================
      - name: Telegram Notification
        if: env.ZK_LINK != ''
        run: |
          PAYLOAD=$(jq -n \
            --arg chat "-1002030539146" \
            --arg text "✅ <b>NEW BUILD: <a href='${ZK_LINK}/${ZK_NAME}.zip'>${ZK_NAME}.zip</a></b>" \
            '{ chat_id: $chat, text: $text, parse_mode: "HTML" }')

          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
